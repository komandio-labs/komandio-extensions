name: Validate and Publish Komandio SDK

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/komandio-sdk/**"
      - ".github/workflows/publish-sdk.yml"
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate JSR package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify package contents and types
        working-directory: packages/komandio-sdk
        run: deno publish --dry-run

  publish:
    name: Publish to JSR
    needs: validate
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify tagged SDK version is on main
        shell: bash
        run: |
          test "sdk-v$(jq -r '.version' packages/komandio-sdk/jsr.json)" = "$GITHUB_REF_NAME"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Publish trusted SDK release
        working-directory: packages/komandio-sdk
        run: deno publish
