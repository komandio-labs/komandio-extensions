name: Validate and Publish Official Extensions

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['*-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test every official extension
        run: deno task test

      - name: Build every official extension
        run: deno task build-all

  publish:
    name: Build, sign and publish
    needs: validate
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, 'sdk-v')
    runs-on: ubuntu-latest
    env:
      PUBLISHER: komandio-labs
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      EXTENSIONS_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
      EXTENSIONS_PUBLIC_BASE_URL: https://extensions.komandio.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Resolve and validate the release
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          extension="${tag%-v*}"
          version="${tag##*-v}"
          manifest="extensions/$PUBLISHER/$extension/manifest.json"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          test -f "$manifest"
          test "$(jq -r '.version' "$manifest")" = "$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "extension=$extension" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and stamp the extension
        shell: bash
        run: |
          extension='${{ steps.release.outputs.extension }}'
          directory="extensions/$PUBLISHER/$extension"
          (cd "$directory" && deno run -A ../../../tools/komander-cli/komander.ts build -o dist/)
          jq --arg id "$PUBLISHER" --arg name 'Komandio Labs' \
            '.publisher = {id: $id, type: "official", displayName: $name}' \
            "$directory/dist/manifest.json" > "$directory/dist/manifest.stamped.json"
          mv "$directory/dist/manifest.stamped.json" "$directory/dist/manifest.json"

      - name: Verify package manifest contains AI tool metadata
        shell: bash
        run: |
          extension='${{ steps.release.outputs.extension }}'
          manifest="extensions/$PUBLISHER/$extension/dist/manifest.json"
          if jq -e '.entry.skill? != null and ((.skill.tools? | type) != "array" or (.skill.tools | length) == 0)' "$manifest" >/dev/null; then
            echo "A skill extension must publish non-empty .skill.tools metadata: $manifest" >&2
            exit 1
          fi

      - name: Pack and sign the immutable extension archive
        id: package
        shell: bash
        env:
          EXTENSIONS_SIGNING_KEY_BASE64: ${{ secrets.EXTENSIONS_SIGNING_KEY_BASE64 }}
        run: |
          extension='${{ steps.release.outputs.extension }}'
          version='${{ steps.release.outputs.version }}'
          slug="$PUBLISHER.$extension"
          directory="extensions/$PUBLISHER/$extension"
          filename="$slug-$version.kxt"
          (cd "$directory/dist" && zip -qr "../$filename" .)
          hash=$(sha256sum "$directory/$filename" | awk '{print $1}')
          printf '%s' "$EXTENSIONS_SIGNING_KEY_BASE64" | base64 -d > signing.pem
          printf '%s' "$hash" | openssl dgst -sha256 -sign signing.pem | base64 -w 0 > signature.txt
          rm -f signing.pem
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "signature=$(cat signature.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish archive and signed catalog to R2
        shell: bash
        env:
          EXTENSIONS_SIGNING_KEY_BASE64: ${{ secrets.EXTENSIONS_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$EXTENSIONS_BUCKET"
          test -n "${{ secrets.R2_ACCOUNT_ID }}"
          extension='${{ steps.release.outputs.extension }}'
          version='${{ steps.release.outputs.version }}'
          filename='${{ steps.package.outputs.filename }}'
          directory="extensions/$PUBLISHER/$extension"
          package_key="packages/$PUBLISHER/$extension/$version/$filename"
          archive_url="$EXTENSIONS_PUBLIC_BASE_URL/$package_key"

          # Extension archives are immutable. A tag must never replace an
          # existing package, otherwise installed clients could receive a
          # different payload for the same signed version.
          if aws s3api head-object --bucket "$EXTENSIONS_BUCKET" --key "$package_key" --endpoint-url "$AWS_ENDPOINT_URL" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing extension package: $package_key" >&2
            exit 1
          fi
          aws s3 cp "$directory/$filename" "s3://$EXTENSIONS_BUCKET/$package_key" --endpoint-url "$AWS_ENDPOINT_URL" --no-progress

          aws s3 cp "s3://$EXTENSIONS_BUCKET/catalog.json" catalog.json --endpoint-url "$AWS_ENDPOINT_URL" --no-progress 2>/dev/null || echo '{"schemaVersion":1,"extensions":[]}' > catalog.json
          jq --arg publisher "$PUBLISHER" --arg id "$extension" --arg version "$version" \
             --arg url "$archive_url" --arg hash '${{ steps.package.outputs.hash }}' --arg signature '${{ steps.package.outputs.signature }}' \
             --slurpfile manifest "$directory/dist/manifest.json" \
             '
               . as $catalog
               | ($manifest[0]) as $manifest
               | ([($catalog.extensions // [])[] | select(.publisher.id == $publisher and .id == $id)] | first) as $existing
               | ($existing.versions // []) as $versions
               | ($manifest + {
                   versions: (
                     [ $versions[] | select(.version != $version) ]
                     + [{ version: $version, archiveUrl: $url, archiveHash: $hash, archiveSignature: $signature, publishedAt: (now | todateiso8601) }]
                     | sort_by(.version)
                   )
                 }) as $updated
               | {
                   schemaVersion: 1,
                   generatedAt: (now | todateiso8601),
                   extensions: (
                     [($catalog.extensions // [])[] | select(.publisher.id != $publisher or .id != $id)]
                     + [$updated]
                     | sort_by(.publisher.id, .id)
                   )
                 }
             ' catalog.json > catalog.next.json
          mv catalog.next.json catalog.json

          catalog_hash=$(sha256sum catalog.json | awk '{print $1}')
          printf '%s' "$EXTENSIONS_SIGNING_KEY_BASE64" | base64 -d > signing.pem
          printf '%s' "$catalog_hash" | openssl dgst -sha256 -sign signing.pem | base64 -w 0 > catalog.signature
          rm -f signing.pem
          jq -n --arg hash "$catalog_hash" --arg signature "$(cat catalog.signature)" '{algorithm:"ECDSA-SHA256",hash:$hash,signature:$signature}' > catalog.signature.json
          aws s3 cp catalog.json "s3://$EXTENSIONS_BUCKET/catalog.json" --endpoint-url "$AWS_ENDPOINT_URL" --no-progress
          aws s3 cp catalog.signature.json "s3://$EXTENSIONS_BUCKET/catalog.signature.json" --endpoint-url "$AWS_ENDPOINT_URL" --no-progress
